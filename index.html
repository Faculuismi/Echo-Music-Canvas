<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">

    <meta name="keywords" content="Echo Music, Canvas, Music App, Background visualizers, custom canvas, music video loops, Spotify Canvas clone, vertical visualizer, M3U8, MP4">
    <link rel="canonical" href="https://canvas.echomusic.fun/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://canvas.echomusic.fun/">
    <meta property="og:title" content="Echo Music Canvas Hub">
    <meta property="og:description" content="Discover, search, and submit custom vertical background visualizers and music video loops for the Echo Music App.">
    <meta property="og:image" content="https://canvas.echomusic.fun/App%20Logo/echo.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://canvas.echomusic.fun/">
    <meta property="twitter:title" content="Echo Music Canvas Hub">
    <meta property="twitter:description" content="Discover, search, and submit custom vertical background visualizers and music video loops for the Echo Music App.">
    <meta property="twitter:image" content="https://canvas.echomusic.fun/App%20Logo/echo.png">

    <link rel="icon" type="image/png" href="App Logo/echo.png">
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>

<body>
    <nav class="top-bar">
        <div class="top-bar-content">
            <a href="index.html" class="brand">
                <img src="App Logo/echo.png" alt="Echo Music Logo" class="app-icon">
                <span class="brand-text">Echo Canvas</span>
            </a>
            
            <div class="nav-search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" class="nav-search-input" placeholder="Search by song, artist..." autocomplete="off">
            </div>

            <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="developer.html" class="nav-btn-text">API</a>
                <a href="pending.html" class="nav-btn-text">Queue</a>
                <a href="contribute.html" class="nav-btn-primary">Upload</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="local-warning" class="local-warning-banner" style="display: none;"></div>

        <section class="gallery-header">
            <span id="song-count" class="badge">Loading...</span>
        </section>

        <section id="canvas-grid" class="pinterest-grid">
            <div class="loader" id="loading-spinner"></div>
        </section>
        <!-- Sentinel for infinite scrolling -->
        <div id="scroll-sentinel" style="height: 1px;"></div>
    </main>

    <script>
        let allItems = [];
        let filteredItems = [];
        let currentPage = 0;
        const itemsPerPage = 20;

        const fallbackItems = [
            { "song": "Dracula", "artist": "Tame Impala", "url": "https://canvas.echomusic.app/Song/1.mp4" },
            { "song": "Flowers", "artist": "Miley Cyrus", "url": "https://canvas.echomusic.app/Song/2.mp4" },
            { "song": "12 to 12", "artist": "sombr", "url": "https://canvas.echomusic.app/Song/12.m3u8" },
            { "song": "her", "artist": "JVKE", "url": "https://canvas.echomusic.app/Song/4.mp4" },
            { "song": "Olu", "artist": "Sid Sriram", "url": "https://canvas.echomusic.app/Song/5.mp4" },
            { "song": "dont be afraid", "artist": "Knxwledge", "url": "https://canvas.echomusic.app/Song/6.mp4" },
            { "song": "Good Goodbye", "artist": "HWASA", "url": "https://canvas.echomusic.app/Song/8.mp4" },
            { "song": "Annihilate", "artist": "Metro Boomin", "url": "https://canvas.echomusic.app/Song/7.m3u8" },
            { "song": "Dawn FM", "artist": "The Weeknd", "url": "https://canvas.echomusic.app/Song/9.m3u8" },
            { "song": "Lost In Yesterday", "artist": "Tame Impala", "url": "https://canvas.echomusic.app/Song/10.m3u8" }
        ];

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function handleSearch(term) {
            const updateDOM = () => {
                if (term.trim() === '') {
                    filteredItems = allItems;
                    const isLocal = window.location.protocol === 'file:';
                    document.getElementById('song-count').textContent = `${allItems.length} ${isLocal ? 'preview' : 'active'} canvases`;
                } else {
                    filteredItems = allItems.filter(item => {
                        const combined = `${item.song} ${item.artist}`.toLowerCase();
                        return combined.includes(term);
                    });
                    document.getElementById('song-count').textContent = filteredItems.length === 1 ? '1 match found' : `${filteredItems.length} matches found`;
                }
                currentPage = 0;
                renderGallery(filteredItems.slice(0, itemsPerPage), false);
            };

            if (document.startViewTransition) {
                document.startViewTransition(updateDOM);
            } else {
                updateDOM();
            }
        }

        function loadNextPage() {
            const startIndex = currentPage * itemsPerPage;
            const nextItems = filteredItems.slice(startIndex, startIndex + itemsPerPage);
            if (nextItems.length > 0) {
                renderGallery(nextItems, true);
            }
        }

        function renderSkeletons(count = 10, append = false) {
            const grid = document.getElementById('canvas-grid');
            if (!append) grid.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const card = document.createElement('article');
                card.className = 'pin-card skeleton-card';
                card.innerHTML = `
                    <div class="pin-media skeleton-media"></div>
                    <div class="pin-info">
                        <div class="skeleton-text skeleton-title"></div>
                        <div class="skeleton-text skeleton-artist"></div>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        async function loadCanvases() {
            renderSkeletons(itemsPerPage);
            try {
                const response = await fetch(`./canvas.json?v=${Date.now()}`);
                if (!response.ok) throw new Error('Failed to load metadata');

                const data = await response.json();
                allItems = data.items || [];
                
                // Reverse so newest are at the top
                allItems.reverse();

                const urlParams = new URLSearchParams(window.location.search);
                const query = urlParams.get('search');
                if (query) {
                    document.getElementById('search-input').value = query;
                    handleSearch(query.toLowerCase());
                } else {
                    handleSearch('');
                }
            } catch (error) {
                console.warn("CORS/Fetch restriction detected. Falling back to local preview.", error);
                allItems = fallbackItems;
                
                if (window.location.protocol === 'file:') {
                    const warningBanner = document.getElementById('local-warning');
                    warningBanner.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Local preview mode. Showing <strong>${allItems.length} canvases</strong>.</span>
                    `;
                    warningBanner.style.display = 'flex';
                }

                handleSearch('');
            }
        }

        function renderGallery(items, append = false) {
            const grid = document.getElementById('canvas-grid');
            if (!append) grid.innerHTML = '';

            if (items.length === 0 && !append) {
                grid.innerHTML = `
                    <p class="empty-state">
                        We couldn't find any canvases matching your search.
                    </p>
                `;
                return;
            }

            items.forEach((item, index) => {
                const card = document.createElement('article');
                card.className = 'pin-card';
                
                let resolvedUrl = item.url;
                try {
                    const parsedUrl = new URL(item.url);
                    const match = parsedUrl.pathname.match(/\/(Song|Album)\/(.+)$/i);
                    if (match) {
                        resolvedUrl = `./${match[1]}/${match[2]}`;
                    }
                } catch (e) {
                }

                const isM3u8 = resolvedUrl && resolvedUrl.toLowerCase().endsWith('.m3u8');
                const videoId = "vid_" + Math.random().toString(36).substr(2, 9) + "_" + index;

                // Add data-src instead of setting src directly for lazy loading. Added preload="none" and poster
                card.innerHTML = `
                    <div class="pin-media">
                        <video id="${videoId}" poster="App Logo/echo.png" preload="none" loop muted playsinline onplay="this.volume=0" data-src="${resolvedUrl}" data-ism3u8="${isM3u8}"></video>
                        <div class="pin-overlay">
                            <button class="pin-action-btn"><i class="fas fa-play"></i> Play</button>
                            <button class="pin-audio-btn"><i class="fas fa-volume-mute"></i></button>
                        </div>
                    </div>
                    <div class="pin-info">
                        <h2 class="pin-title">${item.song}</h2>
                        <h3 class="pin-artist">${item.artist}</h3>
                    </div>
                `;
                grid.appendChild(card);

                const video = document.getElementById(videoId);
                const mediaContainer = card.querySelector('.pin-media');
                const audioBtn = card.querySelector('.pin-audio-btn');
                
                // Set up hover/click interactions immediately
                mediaContainer.addEventListener('mouseenter', () => {
                    video.play().catch(() => {});
                });
                mediaContainer.addEventListener('mouseleave', () => {
                    video.pause();
                });
                card.addEventListener('click', (e) => {
                    // Prevent card click from triggering if audio button is clicked
                    if (e.target.closest('.pin-audio-btn')) return;
                    
                    if (video.paused) {
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });

                audioBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (video.muted) {
                        video.muted = false;
                        video.volume = 1;
                        audioBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                    } else {
                        video.muted = true;
                        video.volume = 0;
                        audioBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                    }
                });

                const handleError = () => {
                    mediaContainer.innerHTML = `
                        <div class="canvas-error-state">
                            <i class="fas fa-link-slash"></i>
                            <span>Unavailable</span>
                        </div>
                    `;
                };
                
                // Improved Error UI instead of hiding
                video.addEventListener('error', handleError);
                card.dataset.videoId = videoId; // Store reference for HLS
                
                // Observe the card for lazy loading
                observer.observe(card);
            });
            
            currentPage++;
        }

        // IntersectionObserver for Lazy Loading Videos
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const video = card.querySelector('video');
                    if (video && video.dataset.src) {
                        const src = video.dataset.src;
                        const isM3u8 = video.dataset.ism3u8 === 'true';
                        
                        if (isM3u8) {
                            if (Hls.isSupported()) {
                                const hls = new Hls();
                                hls.loadSource(src);
                                hls.attachMedia(video);
                                hls.on(Hls.Events.ERROR, function (event, data) {
                                    if (data.fatal) {
                                        const mediaContainer = card.querySelector('.pin-media');
                                        if(mediaContainer) {
                                            mediaContainer.innerHTML = `
                                                <div class="canvas-error-state">
                                                    <i class="fas fa-link-slash"></i>
                                                    <span>Unavailable</span>
                                                </div>
                                            `;
                                        }
                                    }
                                });
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = src;
                            }
                        } else {
                            video.src = src;
                            video.load();
                        }
                        
                        // Remove data-src so we don't load it again
                        video.removeAttribute('data-src');
                    }
                    observer.unobserve(card);
                }
            });
        }, { rootMargin: '100px 0px' });

        // IntersectionObserver for Infinite Scrolling
        const sentinelObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                loadNextPage();
            }
        }, { rootMargin: '200px 0px' });

        const debouncedSearch = debounce((e) => {
            handleSearch(e.target.value.toLowerCase());
        }, 300);

        document.getElementById('search-input').addEventListener('input', debouncedSearch);

        document.addEventListener('DOMContentLoaded', () => {
            loadCanvases();
            const sentinel = document.getElementById('scroll-sentinel');
            if (sentinel) sentinelObserver.observe(sentinel);
        });
    </script>
    <script>
        (function() {
            const btn = document.getElementById('nav-hamburger');
            const menu = document.getElementById('nav-links');
            if (!btn || !menu) return;
            btn.addEventListener('click', () => {
                const open = menu.classList.toggle('nav-open');
                btn.classList.toggle('nav-hamburger--open', open);
                btn.setAttribute('aria-expanded', open);
            });
            menu.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    menu.classList.remove('nav-open');
                    btn.classList.remove('nav-hamburger--open');
                    btn.setAttribute('aria-expanded', 'false');
                });
            });
        })();
    </script>
    
    <a href="https://support.iad1tya.cyou" target="_blank" rel="noopener" class="floating-donation" title="Support Echo Music">
        <i class="fas fa-heart"></i> Support
    </a>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(error => {
                        console.warn('Service worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
