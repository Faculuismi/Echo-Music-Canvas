<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ffffff">
    <title>Echo Music Canvas Hub</title>
    <meta name="description" content="Discover, search, and submit custom vertical background visualizers and music video loops for the Echo Music App.">
    <meta name="keywords" content="Echo Music, Canvas, Music App, Background visualizers, custom canvas, music video loops, Spotify Canvas clone, vertical visualizer, M3U8, MP4">
    <link rel="canonical" href="https://canvas.echomusic.fun/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://canvas.echomusic.fun/">
    <meta property="og:title" content="Echo Music Canvas Hub">
    <meta property="og:description" content="Discover, search, and submit custom vertical background visualizers and music video loops for the Echo Music App.">
    <meta property="og:image" content="https://canvas.echomusic.fun/App%20Logo/echo.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://canvas.echomusic.fun/">
    <meta property="twitter:title" content="Echo Music Canvas Hub">
    <meta property="twitter:description" content="Discover, search, and submit custom vertical background visualizers and music video loops for the Echo Music App.">
    <meta property="twitter:image" content="https://canvas.echomusic.fun/App%20Logo/echo.png">

    <link rel="icon" type="image/png" href="App Logo/echo.png">
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>

<body>
    <nav class="top-bar">
        <div class="top-bar-content">
            <a href="https://canvas.echomusic.fun" class="brand">
                <img src="App Logo/echo.png" alt="Echo Music Logo" class="app-icon">
                <span class="brand-text">Echo Canvas</span>
            </a>
            
            <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="developer.html" class="nav-btn-text">API</a>
                <a href="pending.html" class="nav-btn-text">Queue</a>
                <a href="contribute.html" class="nav-btn-primary">Upload</a>
            </div>
        </div>
    </nav>

    <main class="minimal-container">
        <section class="minimal-center-content">
            <h1 class="total-canvas-text">Total number of Canvas - <span id="total-count">...</span></h1>
            <p class="community-text">From the community for the community</p>
        </section>
    </main>

    <script>
        async function loadCanvasCount() {
            try {
                let response;
                try {
                    response = await fetch(`./canvas.json?v=${Date.now()}`);
                } catch (e) {
                    // If local fetch fails (e.g., CORS on file:// protocol), try fetching from the live site
                    response = await fetch(`https://canvas.echomusic.fun/canvas.json?v=${Date.now()}`);
                }
                
                if (!response || !response.ok) throw new Error('Failed to load metadata');

                const data = await response.json();
                const items = data.items || [];
                document.getElementById('total-count').textContent = items.length.toLocaleString();
            } catch (error) {
                console.warn("Failed to load canvas count:", error);
                document.getElementById('total-count').textContent = 'Many'; 
            }
        }

        document.addEventListener('DOMContentLoaded', loadCanvasCount);
    </script>
    <script>
        (function() {
            const btn = document.getElementById('nav-hamburger');
            const menu = document.getElementById('nav-links');
            if (!btn || !menu) return;
            btn.addEventListener('click', () => {
                const open = menu.classList.toggle('nav-open');
                btn.classList.toggle('nav-hamburger--open', open);
                btn.setAttribute('aria-expanded', open);
            });
            menu.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    menu.classList.remove('nav-open');
                    btn.classList.remove('nav-hamburger--open');
                    btn.setAttribute('aria-expanded', 'false');
                });
            });
        })();
    </script>
    
    <a href="https://support.iad1tya.cyou" target="_blank" rel="noopener" class="floating-donation" title="Support Echo Music">
        <i class="fas fa-heart"></i> Support
    </a>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(error => {
                        console.warn('Service worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
